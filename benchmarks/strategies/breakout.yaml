# Benchmark strategy: channel breakout, with a trailing-style exit rule rather than a fixed
# target. Runs on the built-in Sample data market (made-up prices), not a real market and not a
# recommendation. See benchmarks/README.md.
name: Benchmark - breakout
template: true

market:
  symbol: sample
  label: Sample data
  provider: auto
  timeframe: 1d

direction: long

entry:
  all:
    - left: close
      op: ">"
      right: {indicator: highest, period: 55, source: high, shift: 1}

exit:
  stop: {atr: 3.0, atr_period: 20}
  when:
    left: close
    op: "<"
    right: {indicator: lowest, period: 20, source: low, shift: 1}

risk:
  account_size: 10000
  risk_per_trade_pct: 1.0
  point_value: 1.0
  size_step: 0.01
  min_size: 0.01
  currency: USD

costs:
  spread: 0.5

alerts:
  enabled: false
