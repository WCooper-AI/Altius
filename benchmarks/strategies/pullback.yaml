# Benchmark strategy: pullback. Buys after price has fallen a set % from its recent high while
# the longer trend is still up. Runs on the built-in Sample data market (made-up prices), not a
# real market and not a recommendation. See benchmarks/README.md.
name: Benchmark - pullback
template: true

market:
  symbol: sample
  label: Sample data
  provider: auto
  timeframe: 4h

direction: long

entry:
  all:
    - left: {indicator: pct_from_high, period: 30}
      op: "<="
      right: -3.0
    - left: close
      op: ">"
      right: {indicator: sma, period: 200}

exit:
  stop: {atr: 2.0, atr_period: 14}
  target: {r_multiple: 2.0}
  max_bars: 30

risk:
  account_size: 10000
  risk_per_trade_pct: 1.0
  point_value: 1.0
  size_step: 0.01
  min_size: 0.01
  currency: USD

costs:
  spread: 0.5

alerts:
  enabled: false
