# Benchmark strategy: trend following. Close above a long moving average, entering when RSI
# crosses back up through 50. Runs on the built-in Sample data market (made-up prices), not a
# real market and not a recommendation. See benchmarks/README.md.
name: Benchmark - trend following
template: true

market:
  symbol: sample
  label: Sample data
  provider: auto
  timeframe: 4h

direction: long

entry:
  all:
    - left: close
      op: ">"
      right: {indicator: sma, period: 200}
    - left: {indicator: rsi, period: 14}
      op: crosses_above
      right: 50

exit:
  stop: {atr: 2.0, atr_period: 14}
  target: {r_multiple: 2.0}
  max_bars: 40

risk:
  account_size: 10000
  risk_per_trade_pct: 1.0
  point_value: 1.0
  size_step: 0.01
  min_size: 0.01
  currency: USD

costs:
  spread: 0.5

alerts:
  enabled: false
