# Known vulnerabilities in the Python packages the engine installs (pip-audit), and passwords,
# tokens or keys committed by mistake anywhere in the history (gitleaks, run as a plain CLI so it
# needs no licence for an organisation). Runs on every push and pull request, and weekly so a
# newly published advisory is noticed without a code change.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the engine with every optional extra
        run: |
          python -m venv /tmp/engine
          /tmp/engine/bin/pip install -q "./engine[yahoo,stocks,parquet,keychain]"
          /tmp/engine/bin/pip freeze --exclude-editable | grep -vi '^tradealerts' > /tmp/requirements.txt
      - name: pip-audit
        run: |
          pip install -q pip-audit
          pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off --desc

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history, not just the last commit
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: gitleaks
        run: ./gitleaks git --no-banner --redact --exit-code 1 .
