# On pull requests: lists the dependencies a change adds or upgrades (in the run summary) and fails
# if any has a known high-severity vulnerability.
name: Dependency review

on: [pull_request]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
